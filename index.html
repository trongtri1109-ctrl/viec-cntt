<style>
:root{--ink:#26324B;--text:#3B4352;--muted:#8A94A6;--faint:#B5BDC9;--line:#EDF0F4;--bg:#F4F6F9;--blue:#215695;--blue-t:#EAF1FA;--red:#E4302C;--red-t:#FDEEED;--green:#1FBF8F;--green-d:#14966F;--amber:#F08A24}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font-family:"Roboto","Segoe UI",system-ui,sans-serif;font-size:14px;color:var(--text);background:var(--bg);font-variant-numeric:tabular-nums}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
.app{height:100vh;display:grid;grid-template-columns:250px minmax(0,1fr) 370px;background:#fff;max-width:1680px;margin:0 auto;box-shadow:0 0 0 1px var(--line)}
.app.wide{grid-template-columns:250px minmax(0,1fr)}
.app.wide .right{display:none}
/* left */
.left{background:#FAFBFC;border-right:1px solid var(--line);display:flex;flex-direction:column;padding:28px 0 18px;overflow:auto}
.me{display:flex;align-items:center;gap:14px;padding:0 26px 30px}
.me .av{width:56px;height:56px;font-size:18px}
.me b{display:block;font-size:16px;color:var(--ink);font-weight:500}
.me small{font-size:12px;color:var(--muted)}
.left h4{margin:0 26px 14px;font-size:15px;font-weight:500;color:var(--ink)}
.nav{display:flex;flex-direction:column}
.nav button{all:unset;cursor:pointer;position:relative;white-space:nowrap;display:flex;align-items:center;gap:16px;padding:13px 26px;font-size:15px;color:var(--muted)}
.nav button:hover{color:var(--ink)}
.nav button[aria-current="page"]{color:var(--red);font-weight:500}
.nav button[aria-current="page"]::before{content:"";position:absolute;left:0;top:6px;bottom:6px;width:4px;background:var(--red);border-radius:0 3px 3px 0}
.nav button:focus-visible{outline:2px solid var(--blue);outline-offset:-2px}
.nav svg{width:19px;height:19px;flex:none}
.nav .n{margin-left:auto;font-size:11.5px;font-weight:700;color:#fff;background:var(--red);border-radius:6px;padding:1px 7px}
.left .foot{margin-top:auto;padding:16px 26px 0;border-top:1px solid var(--line)}
.left .foot label{font-size:12px;color:var(--muted);display:block;margin-bottom:6px}
.left select{width:100%;min-width:0;box-sizing:border-box;border:1px solid var(--line);border-radius:10px;padding:8px 30px 8px 10px;background:#fff;font-size:13.5px;text-overflow:ellipsis;white-space:nowrap;overflow:hidden}
.left .foot{min-width:0}
.brand{display:flex;align-items:center;gap:8px;margin-top:14px;font-size:12px;color:var(--muted)}
.brand i{width:3px;height:16px;border-radius:2px;background:linear-gradient(180deg,var(--blue) 0 62%,var(--red) 62%)}
.brand b{color:var(--blue);letter-spacing:.06em}
/* middle */
.mid{overflow:auto;padding:22px 36px 36px;border-right:1px solid var(--line)}
.mhead{display:flex;align-items:center;gap:12px;margin-bottom:6px;flex-wrap:wrap}
.mhead h1{margin:0;font-size:22px;color:var(--ink);font-weight:700}
.mhead .sp{flex:1}
.seg{display:inline-flex;gap:2px;background:var(--bg);border-radius:12px;padding:3px}
.seg button{all:unset;cursor:pointer;padding:6px 12px;border-radius:9px;font-size:12.5px;color:var(--muted);font-weight:500;white-space:nowrap}
.seg button[aria-pressed="true"]{background:#fff;color:var(--ink);box-shadow:0 1px 3px rgba(38,50,75,.1)}
.grp{font-size:16px;color:var(--muted);font-weight:500;margin:22px 0 6px;display:flex;align-items:baseline;gap:8px}
.grp.late{color:var(--red)}
.grp small{font-size:12.5px;color:var(--faint)}
.item{all:unset;cursor:pointer;box-sizing:border-box;width:100%;display:grid;grid-template-columns:50px minmax(0,1fr) auto;gap:16px;align-items:center;padding:12px 10px;border-radius:14px}
.item:hover{background:#F8FAFC}
.item[aria-current="true"]{background:var(--blue-t)}
.ico{width:50px;height:50px;border-radius:12px;display:grid;place-items:center;color:#fff;font-weight:700;font-size:15px}
.item b{display:block;font-size:16px;color:var(--ink);font-weight:500;line-height:1.3;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item .sub{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:14px;font-size:12.5px;color:var(--muted);margin-top:3px}
.item .sub span:first-child{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item .sub .late{color:var(--red);font-weight:500}
.item .sub .soon{color:var(--blue);font-weight:500}
.item .sub .nc{color:var(--amber);font-weight:500}
.stack{display:flex;flex-direction:row-reverse;justify-content:flex-end}
.av{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;color:#fff;font-weight:700;font-size:11px;border:2px solid #fff;flex:none}
.stack .av+.av{margin-right:-8px}
.empty{color:var(--muted);padding:6px 10px}
/* right */
.right{overflow:auto;padding:26px 30px 30px}
.rsec{padding-bottom:24px;margin-bottom:24px;border-bottom:1px solid var(--line)}
.rsec:last-child{border-bottom:0}
.rsec h2{margin:0;font-size:21px;color:var(--ink);font-weight:500;display:flex;align-items:center;gap:10px}
.rsec h2 .sp{flex:1}
.dots{all:unset;cursor:pointer;color:var(--faint);font-size:18px;letter-spacing:1px}
.chipbtn{all:unset;cursor:pointer;display:flex;gap:10px;align-items:center;background:var(--bg);border-radius:16px;padding:7px 12px;color:var(--muted)}
.chipbtn svg{width:17px;height:17px}
.alert{font-size:12.5px;color:var(--red);font-weight:500;margin:22px 0 4px}
.rtitle{display:flex;align-items:flex-start;gap:10px}
.rtitle b{font-size:16px;color:var(--ink);font-weight:500;line-height:1.35;flex:1}
.link{all:unset;cursor:pointer;color:var(--blue);font-weight:500;font-size:15px;white-space:nowrap}
.cdbar{margin-top:18px;display:flex;align-items:center;gap:12px;background:var(--green);border-radius:12px;padding:10px 14px;color:#fff;box-shadow:0 10px 26px rgba(31,191,143,.35)}
.cdbar.late{background:var(--red);box-shadow:0 10px 26px rgba(228,48,44,.3)}
.cdbar .stack .av{border-color:var(--green)}
.cdbar.late .stack .av{border-color:var(--red)}
.cdbar b{flex:1;text-align:center;font-size:17px;font-weight:700}
.cdbar small{font-size:12px;opacity:.9}
.status{display:flex;gap:6px;align-items:center;font-size:13px;color:var(--muted);margin-top:8px}
.kpis{display:grid;grid-template-columns:repeat(3,auto);justify-content:space-between;gap:10px;margin-top:20px}
.kpis small{display:block;font-size:13px;color:var(--muted);margin-bottom:6px}
.kpis b{font-size:30px;color:var(--ink);font-weight:700;position:relative}
.kpis b i{position:absolute;right:-10px;top:4px;width:7px;height:7px;border-radius:50%}
.areatabs{display:flex;gap:6px;margin-top:12px;flex-wrap:wrap}
.areatabs button{all:unset;cursor:pointer;font-size:12px;padding:3px 10px;border-radius:999px;background:var(--bg);color:var(--muted)}
.areatabs button[aria-pressed="true"]{background:var(--ink);color:#fff}
.form{display:flex;flex-direction:column;gap:10px;margin-top:14px}
.form label{font-size:12.5px;color:var(--muted);display:flex;flex-direction:column;gap:5px}
.form input,.form select{border:1px solid var(--line);border-radius:10px;padding:9px 11px;background:#FAFBFC}
.form .two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.btn{all:unset;cursor:pointer;text-align:center;padding:10px 16px;border-radius:10px;font-weight:500;font-size:14px;background:var(--blue);color:#fff}
.btn:hover{background:#2A65A8}
.btn.ghost{background:var(--bg);color:var(--ink)}
/* detail */
.back{all:unset;cursor:pointer;color:var(--muted);font-size:13px;display:flex;gap:6px;align-items:center;margin-bottom:12px}
.back:hover{color:var(--ink)}
.dtag{display:inline-block;font-size:11.5px;font-weight:700;color:#fff;border-radius:999px;padding:2px 10px}
.dtitle{margin:10px 0 6px;font-size:20px;line-height:1.35;color:var(--ink);font-weight:700}
.facts{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:14px 0}
.facts div{background:var(--bg);border-radius:12px;padding:10px 12px}
.facts small{display:block;font-size:11.5px;color:var(--muted)}
.facts b{font-size:14px;color:var(--ink)}
.ci-row{display:grid;grid-template-columns:1fr 64px;gap:10px;align-items:center;margin-bottom:10px}
.ci-row input[type=range]{accent-color:var(--blue)}
.ci-row input[type=number],textarea{border:1px solid var(--line);border-radius:10px;padding:8px 10px;background:#FAFBFC}
.ci-row input[type=number]{text-align:right}
textarea{width:100%;min-height:70px;resize:vertical}
.ci-subs{list-style:none;margin:10px 0 0;padding:0;display:flex;flex-direction:column;gap:5px;font-size:13.5px}
.ci-subs li.d label{text-decoration:line-through;color:var(--faint)}
.ci-subs input{accent-color:var(--blue)}
.ci-act{display:flex;gap:8px;margin-top:12px}
.ci-act button{all:unset;cursor:pointer;padding:9px 16px;border-radius:10px;font-weight:500;font-size:13.5px}
.ci-act .ci-save{background:var(--blue);color:#fff}
.ci-act .ci-done{background:var(--bg);color:var(--ink)}
.ci-note{margin:0;color:var(--muted)}
.hist{display:flex;align-items:flex-end;gap:6px;height:80px;margin-top:6px}
.hist div{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:3px;height:100%;font-size:10px;color:var(--faint)}
.hist i{width:100%;max-width:22px;border-radius:5px 5px 0 0;background:#DCE5F0}
.hist div.now i{background:var(--blue)}
.hist b{font-size:10px;color:var(--ink)}
/* timeline */
.tlwrap{display:flex;flex-direction:column;height:100%;min-height:0}
.tlbar{display:flex;align-items:center;gap:12px;padding:22px 30px 14px;flex-wrap:wrap}
.tlbar h1{margin:0;font-size:22px;color:var(--ink);font-weight:700}
.tlbar .sp{flex:1}
.gantt{flex:1;min-height:0;overflow:auto;margin:0 30px 24px;border:1px solid var(--line);border-radius:16px;position:relative}
.g-in{position:relative}
.g-head{position:sticky;top:0;z-index:4;background:#fff;display:grid;border-bottom:1px solid var(--line)}
.g-corner{position:sticky;left:0;z-index:5;background:#fff;border-right:1px solid var(--line);padding:10px 16px;font-size:12px;color:var(--muted);display:flex;align-items:flex-end}
.g-scale{position:relative;height:56px}
.g-mon{position:absolute;top:0;height:26px;border-left:1px solid var(--line);padding:6px 8px;font-size:12px;font-weight:500;color:var(--ink);white-space:nowrap}
.g-sub{position:absolute;top:28px;height:28px;border-left:1px solid var(--line);font-size:11px;color:var(--muted);display:grid;place-items:center}
.g-sub.td{color:#fff;background:var(--red);border-radius:6px;font-weight:700}
.g-row{display:grid;min-height:46px;border-bottom:1px solid var(--line)}
.g-row:hover .g-name{background:#F8FAFC}
.g-name{position:sticky;left:0;z-index:2;background:#fff;border-right:1px solid var(--line);padding:8px 16px;display:flex;align-items:center;gap:10px;cursor:pointer;min-width:0}
.g-name b{font-size:13.5px;font-weight:500;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1}
.g-name .av{width:26px;height:26px;font-size:10px;border-width:0}
.g-row.gg{min-height:44px;background:#FAFBFC}
.g-row.gg .g-name{background:#FAFBFC;cursor:pointer}
.g-row.gg .g-name b{font-weight:700;font-size:14px}
.g-row.gg .g-name .car{width:16px;color:var(--muted);transition:transform .15s}
.g-row.gg.closed .car{transform:rotate(-90deg)}
.g-row.gg .g-name small{font-size:12px;color:var(--muted);white-space:nowrap}
.g-track{position:relative}
.g-wkend{position:absolute;top:0;bottom:0;background:repeating-linear-gradient(135deg,#FAFBFC 0 5px,#F4F6F9 5px 10px)}
.g-grid{position:absolute;top:0;bottom:0;border-left:1px solid #F3F5F8}
.g-bar{all:unset;cursor:pointer;position:absolute;top:9px;height:28px;border-radius:9px;background:color-mix(in srgb,var(--ac) 22%,#fff);overflow:hidden;display:flex;align-items:center;box-sizing:border-box}
.g-bar:hover{box-shadow:0 4px 12px rgba(38,50,75,.15)}
.g-bar .f{position:absolute;inset:0 auto 0 0;background:var(--ac);border-radius:9px 0 0 9px}
.g-bar .lab{position:relative;z-index:1;font-size:11.5px;font-weight:700;color:#fff;padding:0 8px;white-space:nowrap;text-shadow:0 1px 1px rgba(0,0,0,.2)}
.g-bar.late{box-shadow:inset 0 0 0 2px var(--red)}
.g-out{position:absolute;top:9px;line-height:28px;font-size:11.5px;font-weight:500;color:var(--muted);white-space:nowrap;display:flex;align-items:center;gap:6px;pointer-events:none}
.g-out .late{color:var(--red);font-weight:700}
.g-out .av{width:22px;height:22px;font-size:9px;border-width:0}
.g-sum{position:absolute;top:18px;height:8px;border-radius:4px;background:var(--ac);opacity:.35}
.g-sumf{position:absolute;top:18px;height:8px;border-radius:4px;background:var(--ac)}
.g-dia{position:absolute;top:16px;width:12px;height:12px;background:var(--red);transform:rotate(45deg);border-radius:2px}
.g-today{position:absolute;top:0;bottom:0;width:2px;background:var(--red);z-index:3;pointer-events:none}
.g-legend{display:flex;gap:16px;font-size:12px;color:var(--muted);flex-wrap:wrap;padding:0 30px 18px}
.g-legend span{display:flex;align-items:center;gap:6px}
.g-legend i{display:inline-block;width:22px;height:10px;border-radius:4px}
/* report */
.paper{border:1px solid var(--line);border-radius:14px;overflow:auto;margin-top:16px}
.paper table{border-collapse:collapse;width:100%;min-width:860px;font-size:12.5px}
.paper th{background:var(--blue);color:#fff;font-weight:500;padding:8px;border:1px solid #9FB4D0}
.paper td{border:1px solid var(--line);padding:7px 8px;vertical-align:top}
.paper tr.g td{background:var(--blue-t);font-weight:700;color:var(--ink)}
.num{text-align:right;white-space:nowrap}
.pre{white-space:pre-line}
.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%) translateY(14px);background:var(--ink);color:#fff;padding:10px 16px;border-radius:12px;font-size:13px;font-weight:500;opacity:0;transition:.2s;z-index:40;pointer-events:none}
.toast.show{opacity:1;transform:translateX(-50%)}
@media (max-width:1180px){.app{grid-template-columns:220px minmax(0,1fr) 320px}.mid{padding:20px}.right{padding:20px}}
@media (max-width:900px){.app,.app.wide{grid-template-columns:minmax(0,1fr);height:auto}.mhead span{flex-basis:100%}.left{padding:14px 0}.me{padding:0 16px 12px}.left h4{display:none}.nav{flex-direction:row;overflow-x:auto}.nav button{padding:10px 14px;white-space:nowrap}.nav button[aria-current="page"]::before{left:8px;right:8px;top:auto;bottom:0;width:auto;height:3px}.mid,.right{overflow:visible;border:0}.gantt{margin:0 12px 16px}.tlbar{padding:16px 12px}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

/* ===== role views ===== */
.hello{font-size:13.5px;color:var(--muted);margin:2px 0 0}
.kstrip{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin:18px 0 6px}
.kt{all:unset;cursor:pointer;box-sizing:border-box;border-radius:16px;padding:14px 16px;background:var(--bg);display:flex;flex-direction:column;gap:2px}
.kt:hover{background:#EDF1F6}
.kt b{font-size:28px;font-weight:700;color:var(--ink);line-height:1.1}
.kt span{font-size:12.5px;color:var(--muted)}
.kt.r b{color:var(--red)} .kt.a b{color:var(--amber)} .kt.bl b{color:var(--blue)} .kt.g b{color:var(--green-d)}
.sh{display:flex;align-items:baseline;gap:8px;margin:26px 0 8px}
.sh h2{margin:0;font-size:17px;color:var(--ink);font-weight:700}
.sh small{font-size:12.5px;color:var(--muted)}
.sh .sp{flex:1}
.att{display:grid;grid-template-columns:44px minmax(0,1fr) auto auto;gap:14px;align-items:center;padding:10px;border-radius:14px}
.att:hover{background:#F8FAFC}
.att .ico{width:44px;height:44px;font-size:13px}
.att .t{all:unset;cursor:pointer;min-width:0}
.att .t b{display:block;font-size:14.5px;font-weight:500;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.att .t small{display:flex;gap:6px;flex-wrap:wrap;margin-top:4px}
.why{font-size:11.5px;font-weight:700;border-radius:999px;padding:2px 9px;white-space:nowrap}
.why.late{background:var(--red-t);color:var(--red)} .why.stall{background:#FEF3E7;color:#B56510} .why.nc{background:#FFF7E6;color:#A86A0C} .why.risk{background:var(--blue-t);color:var(--blue)}
.mini{all:unset;cursor:pointer;font-size:12.5px;font-weight:500;color:var(--blue);padding:6px 12px;border-radius:9px;background:var(--blue-t);white-space:nowrap}
.mini:hover{background:#DCE8F6}
.mini.red{color:var(--red);background:var(--red-t)}
.ppl{display:flex;flex-direction:column;gap:10px}
.pr{display:grid;grid-template-columns:200px minmax(140px,1fr) 90px minmax(0,1.3fr) auto;gap:18px;align-items:center;padding:14px 16px;border:1px solid var(--line);border-radius:16px}
.pr:hover{border-color:#D5DFEC}
.pr .who{display:flex;align-items:center;gap:12px;min-width:0}
.pr .who .av{width:40px;height:40px;font-size:13px;border:0}
.pr .who b{display:block;color:var(--ink);font-size:15px}
.pr .who small{color:var(--muted);font-size:12px}
.load small{display:flex;justify-content:space-between;font-size:11.5px;color:var(--muted);margin-bottom:5px}
.lbar{display:flex;height:10px;border-radius:5px;overflow:hidden;background:var(--bg)}
.lbar i{display:block;height:100%}
.ring2{--p:0;width:48px;height:48px;border-radius:50%;background:conic-gradient(var(--green) calc(var(--p)*1%),#E7ECF2 0);display:grid;place-items:center;margin:auto}
.ring2 span{width:38px;height:38px;border-radius:50%;background:#fff;display:grid;place-items:center;font-size:11.5px;font-weight:700;color:var(--ink)}
.ck small{display:block;text-align:center;font-size:10.5px;color:var(--muted);margin-top:3px}
.nxt{all:unset;cursor:pointer;min-width:0;display:flex;align-items:center;gap:10px}
.nxt .cd,.dlr .cd{flex:none;text-align:center;border-radius:10px;padding:4px 8px;line-height:1.05;min-width:48px}
.nxt .cd b,.dlr .cd b{display:block;font-size:16px;font-weight:700}
.nxt .cd small,.dlr .cd small{font-size:9.5px;font-weight:700}
.cd.late{background:var(--red-t);color:var(--red)} .cd.soon{background:#FEF3E7;color:#B56510} .cd.ok{background:var(--blue-t);color:var(--blue)}
.nxt span.tt{min-width:0}
.nxt span.tt b{display:block;font-size:13px;color:var(--ink);font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nxt span.tt small{font-size:11.5px;color:var(--muted)}
.ckbig{display:flex;align-items:center;gap:16px;margin-top:16px}
.ckbig .ring2{width:86px;height:86px;margin:0}
.ckbig .ring2 span{width:70px;height:70px;font-size:18px}
.ckbig p{margin:0;font-size:13px;color:var(--muted);line-height:1.5}
.ckbig p b{color:var(--ink)}
.btns{display:flex;flex-direction:column;gap:8px;margin-top:16px}
.btn.red{background:var(--red)} .btn.red:hover{background:#CC2622}
.btn:disabled{opacity:.45;cursor:not-allowed}
.health{display:flex;flex-direction:column;gap:12px;margin-top:14px}
.health div{display:grid;grid-template-columns:minmax(0,1fr) 44px;gap:4px 10px;align-items:center;font-size:13px}
.health b{font-weight:500;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.health em{font-style:normal;font-size:12px;color:var(--muted);text-align:right}
.health .hb{grid-column:1/-1;height:7px;border-radius:4px;background:var(--bg);overflow:hidden}
.health .hb i{display:block;height:100%;border-radius:4px}
.health small{grid-column:1/-1;font-size:11.5px;color:var(--muted)}
.health small.l{color:var(--red);font-weight:500}
.wk7{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-top:14px}
.wk7 div{border-radius:12px;background:var(--bg);padding:8px 4px;text-align:center;min-height:74px;display:flex;flex-direction:column;gap:4px;align-items:center}

.wk7 small{font-size:11px;color:var(--muted);font-weight:500}

.wk7 b{font-size:16px;color:var(--ink)}
.wk7 div.td b{color:#fff}
.wk7 i{font-style:normal;font-size:10.5px;font-weight:700;color:#fff;background:var(--red);border-radius:8px;padding:0 6px}
.wk7 i.b{background:var(--blue)}
/* focus */
.hero{margin-top:18px;border-radius:22px;padding:22px 24px;background:linear-gradient(135deg,#215695 0%,#1B4A84 60%,#173F70 100%);color:#fff;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:20px;align-items:center;position:relative;overflow:hidden}
.hero::after{content:"";position:absolute;right:-60px;top:-80px;width:240px;height:240px;border-radius:50%;background:radial-gradient(circle,rgba(228,48,44,.35),transparent 65%)}
.hero small{display:block;font-size:12.5px;color:#BFD3EC;font-weight:500}
.hero h2{margin:6px 0 8px;font-size:22px;line-height:1.3;font-weight:700}
.hero p{margin:0;font-size:13.5px;color:#DCE7F5}
.hero .acts{display:flex;gap:8px;margin-top:16px;flex-wrap:wrap}
.hero .acts button{all:unset;cursor:pointer;padding:9px 16px;border-radius:10px;font-weight:500;font-size:13.5px}
.hero .acts .p{background:#fff;color:var(--blue)}
.hero .acts .s{background:rgba(255,255,255,.14);color:#fff;border:1px solid rgba(255,255,255,.25)}
.hero .big{position:relative;z-index:1;text-align:center}
.hero .big b{display:block;font-size:56px;font-weight:700;line-height:1}
.hero .big span{font-size:13px;color:#DCE7F5}
.hero.late .big b{color:#FF9C98}
.ckp{margin-top:16px;border-radius:18px;background:var(--bg);padding:14px 16px;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:16px;align-items:center}
.ckp b{color:var(--ink);font-size:14.5px}
.right .ckp b{font-size:13.5px}
.ckp small{display:block;color:var(--muted);font-size:12.5px;margin-top:2px}
.ckp .bar2{height:8px;border-radius:4px;background:#E2E8F0;overflow:hidden;margin-top:8px}
.ckp .bar2 i{display:block;height:100%;background:var(--green)}
.ckp.done{background:#E8F7F1}
/* wizard */
dialog.wiz{border:0;border-radius:22px;padding:0;width:min(560px,94vw);box-shadow:0 30px 80px rgba(20,30,50,.35)}
dialog.wiz::backdrop{background:rgba(20,30,50,.45)}
.wz{padding:22px 24px 24px}
.wz .top{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.wz .steps{display:flex;gap:4px;flex:1}
.wz .steps i{flex:1;height:5px;border-radius:3px;background:#E2E8F0}
.wz .steps i.on{background:var(--blue)} .wz .steps i.ok{background:var(--green)}
.wz .cnt{font-size:12.5px;color:var(--muted);font-weight:500;white-space:nowrap}
.wz h3{margin:10px 0 4px;font-size:19px;color:var(--ink);line-height:1.35}
.wz .meta{font-size:13px;color:var(--muted);margin-bottom:14px}
.wz .meta b{color:var(--ink)}
.wz .quick{display:flex;gap:6px;flex-wrap:wrap;margin:-2px 0 12px}
.wz .quick button{all:unset;cursor:pointer;font-size:12.5px;font-weight:500;padding:5px 11px;border-radius:999px;background:var(--bg);color:var(--ink)}
.wz .quick button:hover{background:var(--blue-t);color:var(--blue)}
.wz .last{font-size:12.5px;color:var(--muted);margin:0 0 6px}
.wz .row3{display:flex;gap:8px;margin-top:14px}
.wz .row3 .sp{flex:1}
.wz .fin{text-align:center;padding:20px 0 6px}
.wz .fin b{display:block;font-size:44px}
.wz .fin h3{margin:6px 0}
.pfil{display:inline-flex;align-items:center;gap:8px;background:var(--blue-t);color:var(--blue);font-weight:500;font-size:13px;border-radius:999px;padding:4px 6px 4px 4px;margin-top:10px}
.pfil .av{width:24px;height:24px;font-size:10px;border:0}
.pfil button{all:unset;cursor:pointer;width:20px;height:20px;border-radius:50%;display:grid;place-items:center;background:#fff;font-size:13px}
@media (max-width:1180px){.pr{grid-template-columns:170px minmax(0,1fr) 70px;}.pr .nxt,.pr>.mini{grid-column:1/-1}}
@media (max-width:900px){.kstrip{grid-template-columns:1fr 1fr}.pr{grid-template-columns:1fr 70px}.pr .load{grid-column:1/-1}.att{grid-template-columns:40px minmax(0,1fr)}.att .mini{grid-column:2}.hero{grid-template-columns:1fr}.wk7{grid-template-columns:repeat(4,1fr)}}

/* ===== department tabs ===== */
.dtabs{display:flex;gap:4px;margin:16px 0 4px;padding:4px;background:var(--bg);border-radius:14px;overflow-x:auto}
.dtabs button{all:unset;cursor:pointer;flex:1;display:flex;align-items:center;justify-content:center;gap:8px;padding:10px 12px;border-radius:10px;font-size:14px;color:var(--muted);font-weight:500;white-space:nowrap}
.dtabs button:hover{color:var(--ink)}
.dtabs button[aria-selected="true"]{background:#fff;color:var(--ink);font-weight:700;box-shadow:0 1px 4px rgba(38,50,75,.12)}
.dtabs button:focus-visible{outline:2px solid var(--blue);outline-offset:-2px}
.dtabs .sw{width:10px;height:10px;border-radius:3px}
.dtabs .n{font-size:11.5px;font-weight:700;border-radius:9px;padding:0 7px;background:#E3E8EF;color:var(--muted)}
.dtabs .n.r{background:var(--red-t);color:var(--red)}
.band{margin-top:16px;border-radius:20px;padding:18px 22px;color:#fff;background:var(--bc);display:grid;grid-template-columns:minmax(0,1fr) auto;gap:18px;align-items:center;position:relative;overflow:hidden}
.band::after{content:"";position:absolute;right:-50px;top:-70px;width:220px;height:220px;border-radius:50%;background:rgba(255,255,255,.08)}
.band small{display:block;font-size:12.5px;opacity:.85;font-weight:500}
.band h2{margin:4px 0 6px;font-size:21px;font-weight:700}
.band p{margin:0;font-size:13px;opacity:.9}
.band .lead{display:flex;align-items:center;gap:8px;margin-top:10px;font-size:13px}
.band .lead .av{border-color:rgba(255,255,255,.6)}
.band .nums{display:flex;gap:10px;position:relative;z-index:1}
.band .nums div{background:rgba(255,255,255,.14);border-radius:14px;padding:10px 14px;text-align:center;min-width:84px}
.band .nums b{display:block;font-size:24px;font-weight:700;line-height:1.1}
.band .nums span{font-size:11.5px;opacity:.9}
.goals2{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
.gcard{border:1px solid var(--line);border-radius:16px;padding:14px 16px;display:flex;flex-direction:column;gap:10px;position:relative}
.gcard::before{content:"";position:absolute;left:0;top:14px;bottom:14px;width:4px;border-radius:0 3px 3px 0;background:var(--red)}
.gcard .q{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--muted)}
.gcard .q b{font-size:12px;color:#fff;background:var(--red);border-radius:6px;padding:1px 8px}
.gcard p{margin:0;font-size:14px;font-weight:500;color:var(--ink);line-height:1.4}
.gcard .ft{display:flex;align-items:center;gap:8px;margin-top:auto}
.gcard select{border:1px solid var(--line);border-radius:9px;padding:5px 8px;font-size:12.5px;background:#FAFBFC}
.gcard select.done{color:var(--green-d);border-color:#BFE8D9;background:#EAF8F2}
.gcard select.hold{color:#B56510;border-color:#F6D9B8;background:#FEF6EC}
.gcard .open{all:unset;cursor:pointer;margin-left:auto;font-size:12.5px;color:var(--blue);font-weight:500}
.deps{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.dep{all:unset;cursor:pointer;box-sizing:border-box;border:1px solid var(--line);border-radius:18px;padding:16px;display:flex;flex-direction:column;gap:12px;border-top:4px solid var(--ac)}
.dep:hover{border-color:#D5DFEC;border-top-color:var(--ac);box-shadow:0 8px 22px rgba(38,50,75,.06)}
.dep .h{display:flex;align-items:center;gap:10px}
.dep .h b{font-size:15px;color:var(--ink);line-height:1.3}
.dep .h small{display:block;font-size:12px;color:var(--muted);font-weight:400}
.dep .row{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;text-align:center}
.dep .row div{background:var(--bg);border-radius:10px;padding:6px 4px}
.dep .row b{display:block;font-size:18px;color:var(--ink);font-weight:700}
.dep .row b.r{color:var(--red)} .dep .row b.a{color:#B56510}
.dep .row span{font-size:11px;color:var(--muted)}
.dep .pb small{display:flex;justify-content:space-between;font-size:11.5px;color:var(--muted);margin-bottom:4px}
.dep .pb .hb{height:7px;border-radius:4px;background:var(--bg);overflow:hidden}
.dep .pb .hb i{display:block;height:100%;background:var(--ac);border-radius:4px}
.dep .go{font-size:12.5px;color:var(--blue);font-weight:500}
.dl{display:flex;flex-direction:column;gap:6px}
.dlr{all:unset;cursor:pointer;box-sizing:border-box;display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:12px;align-items:center;padding:8px 10px;border-radius:12px}
.dlr:hover{background:#F8FAFC}
.dlr .tt b{display:block;font-size:13.5px;color:var(--ink);font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dlr .tt small{font-size:12px;color:var(--muted)}
.dlr .ad{font-size:11px;font-weight:700;color:#fff;border-radius:6px;padding:1px 7px}
@media (max-width:1180px){.deps{grid-template-columns:1fr}}
@media (max-width:900px){.band{grid-template-columns:1fr}.band .nums{flex-wrap:wrap}.dtabs button{flex:none}}

/* ===================== LIQUID GLASS THEME ===================== */
:root{--glass:rgba(255,255,255,.42);--glass-hi:rgba(255,255,255,.62);--glass-edge:rgba(255,255,255,.75);--glass-sh:0 10px 30px rgba(24,52,96,.10),0 1px 2px rgba(24,52,96,.06);--line:rgba(38,50,75,.08);--bg:rgba(255,255,255,.38)}
html,body{background:#E9EEF6}
body{background:
  radial-gradient(42% 52% at 6% 8%,rgba(33,86,149,.55) 0%,transparent 70%),
  radial-gradient(36% 46% at 96% 4%,rgba(228,48,44,.30) 0%,transparent 70%),
  radial-gradient(40% 50% at 80% 96%,rgba(28,131,168,.42) 0%,transparent 70%),
  radial-gradient(34% 44% at 18% 92%,rgba(81,98,168,.38) 0%,transparent 70%),
  radial-gradient(30% 40% at 50% 45%,rgba(255,255,255,.9) 0%,transparent 70%),
  linear-gradient(135deg,#DCE6F4 0%,#EEF2F8 50%,#E4ECF6 100%);background-attachment:fixed}
body::before{content:"";position:fixed;inset:-20%;z-index:-1;pointer-events:none;background:radial-gradient(30% 30% at 30% 30%,rgba(33,86,149,.25),transparent 70%),radial-gradient(25% 25% at 70% 60%,rgba(228,48,44,.16),transparent 70%);filter:blur(40px);animation:drift 28s ease-in-out infinite alternate}
@keyframes drift{to{transform:translate(4%,-3%) scale(1.06)}}
.app{background:transparent;box-shadow:none;gap:14px;padding:14px;max-width:1720px}
.app.wide{grid-template-columns:250px minmax(0,1fr)}
/* panels */
.left,.mid,.right{background:var(--glass);border:1px solid var(--glass-edge);border-radius:28px;box-shadow:var(--glass-sh),inset 0 1px 0 rgba(255,255,255,.9),inset 0 -1px 0 rgba(255,255,255,.25);backdrop-filter:blur(28px) saturate(180%);-webkit-backdrop-filter:blur(28px) saturate(180%)}
.mid{border-right:1px solid var(--glass-edge)}
.left{border-right:1px solid var(--glass-edge)}
.left .foot{border-top:1px solid rgba(255,255,255,.6)}
.me .av,.who .av{box-shadow:0 4px 12px rgba(24,52,96,.2)}
/* nav pills */
.nav{padding:0 12px;gap:4px}
.nav button{border-radius:16px;padding:12px 14px}
.nav button[aria-current="page"]{background:rgba(255,255,255,.72);box-shadow:0 4px 14px rgba(24,52,96,.10),inset 0 1px 0 #fff;color:var(--red)}
.nav button[aria-current="page"]::before{display:none}
.nav button:hover{background:rgba(255,255,255,.45)}
/* glass tiles */
.kt,.gcard,.dep,.pr,.item,.att,.dlr,.ckp,.wk7>div,.facts>div,.rsec,.band,.hero,.g-bar,.dtabs button,.mini,.btn,.chipbtn,.cdbar,.nxt,.seg button{--mx:50%;--my:50%}
.kt,.gcard,.dep,.pr,.att,.dlr,.ckp,.wk7>div,.facts>div{background:rgba(255,255,255,.48);border:1px solid rgba(255,255,255,.8);box-shadow:0 6px 18px rgba(24,52,96,.07),inset 0 1px 0 rgba(255,255,255,.95);backdrop-filter:blur(16px) saturate(170%);-webkit-backdrop-filter:blur(16px) saturate(170%)}
.kt,.gcard,.dep,.pr,.item,.att,.dlr,.ckp,.wk7>div,.facts>div,.rsec,.band,.hero,.dtabs button{position:relative;overflow:hidden;transition:transform .25s cubic-bezier(.2,.8,.2,1),box-shadow .25s,background .25s,border-color .25s}
.kt{border-radius:22px}
.gcard{border-radius:22px}
.dep{border-radius:24px;border-top:4px solid var(--ac)}
.pr{border-radius:22px}
.item,.att,.dlr{border-radius:18px}
.wk7>div{border-radius:16px}
.facts>div{border-radius:16px}
.ckp{border-radius:20px}
/* specular light following cursor */
.kt::after,.gcard::after,.dep::after,.pr::after,.item::after,.att::after,.dlr::after,.ckp::after,.wk7>div::after,.facts>div::after,.rsec::after,.band::before,.hero::before,.dtabs button::after{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;opacity:0;transition:opacity .3s;
  background:radial-gradient(260px circle at var(--mx) var(--my),rgba(255,255,255,.85),rgba(255,255,255,.25) 35%,transparent 65%);mix-blend-mode:soft-light}
.band::before,.hero::before{background:radial-gradient(320px circle at var(--mx) var(--my),rgba(255,255,255,.45),transparent 60%);mix-blend-mode:overlay;z-index:0}
.kt:hover,.gcard:hover,.dep:hover,.pr:hover,.att:hover,.dlr:hover,.ckp:hover,.wk7>div:hover,.item:hover{transform:translateY(-3px) scale(1.01);background:rgba(255,255,255,.7);border-color:#fff;box-shadow:0 18px 40px rgba(24,52,96,.16),0 0 0 1px rgba(255,255,255,.9),inset 0 1px 0 #fff,inset 0 0 24px rgba(255,255,255,.55)}
.dep:hover{border-top-color:var(--ac)}
.kt:hover::after,.gcard:hover::after,.dep:hover::after,.pr:hover::after,.item:hover::after,.att:hover::after,.dlr:hover::after,.ckp:hover::after,.wk7>div:hover::after,.facts>div:hover::after,.rsec:hover::after,.band:hover::before,.hero:hover::before,.dtabs button:hover::after{opacity:1}
/* glossy rim on hover (iOS-like edge light) */
.kt:hover,.dep:hover,.pr:hover,.gcard:hover{outline:1px solid rgba(255,255,255,.95);outline-offset:-1px}
/* tabs as glass segmented control */
.dtabs{background:rgba(255,255,255,.35);border:1px solid rgba(255,255,255,.7);border-radius:20px;padding:5px;box-shadow:inset 0 1px 2px rgba(24,52,96,.06)}
.dtabs button{border-radius:15px}
.dtabs button[aria-selected="true"]{background:rgba(255,255,255,.85);box-shadow:0 6px 18px rgba(24,52,96,.12),inset 0 1px 0 #fff}
.dtabs button:hover{background:rgba(255,255,255,.55)}
.dtabs .n{background:rgba(38,50,75,.07)}
/* right column cards */
.right{padding:18px}
.rsec{background:rgba(255,255,255,.45);border:1px solid rgba(255,255,255,.8);border-radius:22px;padding:18px;margin-bottom:14px;box-shadow:0 6px 18px rgba(24,52,96,.06),inset 0 1px 0 #fff}
.rsec:last-child{border-bottom:1px solid rgba(255,255,255,.8)}
.rsec:hover{background:rgba(255,255,255,.6)}
.rsec h2{font-size:18px}
/* band / hero glass sheen */
.band,.hero{border-radius:26px;box-shadow:0 18px 40px rgba(24,52,96,.22),inset 0 1px 0 rgba(255,255,255,.35)}
.band:hover,.hero:hover{transform:translateY(-2px)}
.band .nums div,.hero .acts .s{backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border:1px solid rgba(255,255,255,.22)}
/* buttons */
.btn{border-radius:14px;box-shadow:0 6px 16px rgba(33,86,149,.25),inset 0 1px 0 rgba(255,255,255,.3);transition:transform .2s,box-shadow .2s,filter .2s}
.btn:hover{transform:translateY(-1px);filter:brightness(1.08);box-shadow:0 10px 24px rgba(33,86,149,.32),inset 0 1px 0 rgba(255,255,255,.4)}
.btn.red{box-shadow:0 6px 16px rgba(228,48,44,.28),inset 0 1px 0 rgba(255,255,255,.3)}
.btn.ghost{background:rgba(255,255,255,.6);box-shadow:inset 0 1px 0 #fff,0 2px 8px rgba(24,52,96,.06)}
.mini{background:rgba(255,255,255,.6);border:1px solid rgba(255,255,255,.85);transition:background .2s,transform .2s}
.mini:hover{background:#fff;transform:translateY(-1px)}
.mini.red{background:rgba(253,238,237,.75)}
/* inputs */
.form input,.form select,textarea,.ci-row input[type=number],.left select,.gcard select{background:rgba(255,255,255,.6)!important;border:1px solid rgba(255,255,255,.85)!important;box-shadow:inset 0 1px 2px rgba(24,52,96,.06);backdrop-filter:blur(8px)}
/* misc surfaces */
.load small{gap:6px;font-size:11px}.load small span{white-space:nowrap}
.why{backdrop-filter:blur(6px)}
.lbar,.dep .pb .hb,.health .hb,.ckp .bar2{background:rgba(38,50,75,.08)}
.ring2 span{background:rgba(255,255,255,.85)}
.ring2{background:conic-gradient(var(--green) calc(var(--p)*1%),rgba(38,50,75,.1) 0)}
.item[aria-current="true"]{background:rgba(255,255,255,.8);box-shadow:0 8px 22px rgba(24,52,96,.1),inset 0 1px 0 #fff}
.grp{padding-left:4px}
/* gantt glass */
.gantt{background:rgba(255,255,255,.45);border:1px solid rgba(255,255,255,.8);border-radius:22px;backdrop-filter:blur(20px);box-shadow:inset 0 1px 0 #fff}
.g-head,.g-corner,.g-name{background:#F7F9FC!important}
.g-row.gg,.g-row.gg .g-name{background:#EEF3F9!important}
.g-row:hover .g-name{background:#fff!important}
.g-bar{transition:transform .2s,box-shadow .2s}
.g-bar:hover{transform:translateY(-1px) scaleY(1.08);box-shadow:0 6px 16px rgba(24,52,96,.2),0 0 0 2px rgba(255,255,255,.9)}
.paper{background:rgba(255,255,255,.7);backdrop-filter:blur(16px)}
dialog.wiz{background:rgba(255,255,255,.82);backdrop-filter:blur(30px) saturate(180%);-webkit-backdrop-filter:blur(30px) saturate(180%);border:1px solid rgba(255,255,255,.9)}
.toast{background:rgba(38,50,75,.82);backdrop-filter:blur(12px)}
@media (max-width:900px){.app,.app.wide{padding:8px;gap:8px}.left,.mid,.right{border-radius:22px}}
@media (prefers-reduced-motion:reduce){body::before{animation:none}.kt:hover,.gcard:hover,.dep:hover,.pr:hover,.att:hover,.dlr:hover,.ckp:hover,.wk7>div:hover,.item:hover{transform:none}}
@supports not ((backdrop-filter:blur(1px)) or (-webkit-backdrop-filter:blur(1px))){.left,.mid,.right{background:rgba(255,255,255,.88)}}

/* avatar photo + upload */
.av{overflow:hidden}
.av img{width:100%;height:100%;object-fit:cover;display:block}
.avup{position:relative;cursor:pointer;flex:none;border-radius:50%}
.avup .cam{position:absolute;right:-2px;bottom:-2px;width:22px;height:22px;border-radius:50%;background:#fff;color:var(--blue);display:grid;place-items:center;box-shadow:0 2px 6px rgba(24,52,96,.25);transition:transform .2s}
.avup .cam svg{width:12px;height:12px}
.avup:hover .cam{transform:scale(1.15)}
.avup:hover .av{filter:brightness(.92)}
.avup:focus-within{outline:2px solid var(--blue);outline-offset:3px}
.me .rm{all:unset;cursor:pointer;display:block;font-size:11.5px;color:var(--muted);margin-top:3px}
.me .rm:hover{color:var(--red)}
/* WBS code chips */
.wbs{flex:none;min-width:40px;height:24px;padding:0 7px;border-radius:7px;display:grid;place-items:center;font-size:11.5px;font-weight:700;color:#fff;background:var(--ac);letter-spacing:.01em;box-shadow:inset 0 1px 0 rgba(255,255,255,.25)}
.g-row.gg .g-name .wbs{min-width:30px}
.ico{font-size:13px;letter-spacing:-.01em}
.code{font-weight:700;color:var(--ac,var(--blue));margin-right:4px}
.logo{padding:0 22px 22px;margin-bottom:18px;border-bottom:1px solid rgba(255,255,255,.6)}
.logo img{display:block;width:100%;max-width:190px;height:auto}
.logo small{display:block;margin-top:6px;font-size:11.5px;color:var(--muted);letter-spacing:.02em}
.left{padding-top:22px}
@media (max-width:900px){.logo{padding:0 16px 12px;margin-bottom:10px}.logo img{max-width:140px}}

/* ---- timeline: tree indent, no weekend hatch, bar styles ---- */
.g-wkend{display:none}
.g-row:not(.gg) .g-name{padding-left:58px;position:sticky}
.g-row:not(.gg) .g-name::before{content:"";position:absolute;left:47px;top:0;bottom:0;width:2px;background:color-mix(in srgb,var(--ac) 28%,transparent)}
.g-row:not(.gg) .g-name::after{content:"";position:absolute;left:47px;top:50%;width:9px;height:2px;background:color-mix(in srgb,var(--ac) 28%,transparent)}
.g-row.last .g-name::before{bottom:50%}
.g-row.gg .g-name .ico{width:26px;height:26px;border-radius:8px;font-size:11px}
.bstyle{display:flex;align-items:center;gap:8px}
.bstyle>span{font-size:12.5px;color:var(--muted)}
.pv{display:inline-block;width:26px;height:10px;vertical-align:middle;margin-right:6px;position:relative;border-radius:3px;background:#D6E1EF;overflow:hidden}
.pv::after{content:"";position:absolute;inset:0 45% 0 0;background:#215695}
.pv.pill{border-radius:999px}.pv.pill::after{border-radius:999px}
.pv.thin{height:4px;border-radius:2px;overflow:visible;margin-top:3px;margin-bottom:3px}.pv.thin::before{content:"";position:absolute;right:-3px;top:-3px;width:8px;height:8px;border-radius:50%;background:#fff;border:2px solid #215695;box-sizing:border-box;z-index:1}
.pv.grad::after{background:linear-gradient(90deg,#8FB2DD,#215695)}
.pv.outline{background:#fff;box-shadow:inset 0 0 0 1.5px #215695}
.pv.ms{background:none;height:12px;overflow:visible}.pv.ms::after{inset:5px 0 5px 0;background:#B9CBE2;border-radius:1px}.pv.ms::before{content:"";position:absolute;right:2px;top:1px;width:9px;height:9px;background:#215695;transform:rotate(45deg);border-radius:2px;z-index:1}
.g-out .pp{display:none;font-weight:700;color:var(--ink)}
/* pill */
.gantt[data-bar=pill] .g-bar{top:12px;height:22px;border-radius:999px}
.gantt[data-bar=pill] .g-bar .f{border-radius:999px}

function dueInfo(t){
  if(t.goal)return{l:'Mục tiêu '+t.q,k:'goal'};
  if(t.pct>=100)return{l:'Đã xong',k:'done'};
  if(!t.due)return{l:'Chưa có hạn',k:''};
  const n=ddiff(t.due);
  if(n<0)return{l:`Trễ ${-n} ngày`,k:'late',n};
  if(n===0)return{l:'Hôm nay',k:'today',n};
  if(n===1)return{l:'Ngày mai',k:'soon',n};
  if(n<=6)return{l:`Còn ${n} ngày`,k:'soon',n};
  return{l:`Hạn ${dmy(t.due)}`,k:'later',n};
}

function checkinBody(t){

  return `<div class="ci-row"><input type="range" min="0" max="100" step="5" value="${t.pct}" data-ci-range aria-label="Phần trăm hoàn thành"><input type="number" min="0" max="100" value="${t.pct}" data-ci-num aria-label="Phần trăm"></div>
  <textarea data-ci-note placeholder="Tuần này đã làm gì, vướng gì?">${esc(t.note)}</textarea>
  ${t.subs.length?`<ul class="ci-subs">${t.subs.map((s,i)=>`<li class="${s.d?'d':''}"><label><input type="checkbox" data-ci-sub="${i}" ${s.d?'checked':''}> ${esc(s.t)}</label></li>`).join('')}</ul>`:''}
  <div class="ci-act"><button class="ci-save" data-ci-save="${t.id}">Lưu check-in</button><button class="ci-done" data-ci-done="${t.id}">Đánh dấu xong</button></div>`;
}
document.addEventListener('input',e=>{
  if(e.target.matches('[data-ci-range]')){const n=e.target.closest('.ci-row').querySelector('[data-ci-num]');n.value=e.target.value;}
  if(e.target.matches('[data-ci-num]')){const n=e.target.closest('.ci-row').querySelector('[data-ci-range]');n.value=e.target.value;}
});
function ciHandle(e,after){
  const s=e.target.closest('[data-ci-save]'),d=e.target.closest('[data-ci-done]'),sub=e.target.closest('[data-ci-sub]');
  if(s){const box=s.closest('[data-ci-box]');saveCheckin(s.dataset.ciSave,box.querySelector('[data-ci-num]').value,box.querySelector('[data-ci-note]').value);toast('Đã lưu check-in');after();return true;}
  if(d){markDone(d.dataset.ciDone);toast('Đã đánh dấu hoàn thành');after();return true;}
  if(sub){const box=sub.closest('[data-ci-box]');task(box.dataset.ciBox).subs[+sub.dataset.ciSub].d=sub.checked;return true;}
  return false;
}

function vTimeline(){

  const days=Math.round((Date.parse(t1)-Date.parse(t0))/864e5), W=days*px, X=d=>Math.max(0,(Date.parse(d)-Date.parse(t0))/864e5*px);
  let mon='',sub='',bg='';
  for(let d=new Date(t0);d<new Date(t1);d.setUTCMonth(d.getUTCMonth()+1)){const ds=d.toISOString().slice(0,10),nx=new Date(Date.UTC(d.getUTCFullYear(),d.getUTCMonth()+1,1)).toISOString().slice(0,10);mon+=`<div class="g-mon" style="left:${X(ds)}px;width:${X(nx)-X(ds)}px">Tháng ${d.getUTCMonth()+1}/${d.getUTCFullYear()}</div>`;}
  if(zoom==='week'){for(let i=0;i<days;i++){const d=addDays(t0,i),w=dowOf(d);sub+=`<div class="g-sub ${d===TODAY?'td':''}" style="left:${i*px}px;width:${px}px">${+d.slice(8)}</div>`;if(w===1)bg+=`<div class="g-grid" style="left:${i*px}px"></div>`;}}
  else{for(let i=0;i<days;i++){const d=addDays(t0,i);if(dowOf(d)===1){sub+=`<div class="g-sub" style="left:${i*px}px;width:${7*px}px">${zoom==='month'?dmy(d):''}</div>`;bg+=`<div class="g-grid" style="left:${i*px}px"></div>`;}}}
  const cols=`${LW}px ${W}px`;
  let rows='';
  AREAS.filter(a=>S.tArea.has(a.code)).forEach(a=>{
    const g=ts.filter(t=>t.area===a.code);if(!g.length)return;
    const s=g.reduce((m,t)=>t.start<m?t.start:m,'9999'),e=g.reduce((m,t)=>t.due>m?t.due:m,'0000'),wk=g.filter(t=>!t.goal),avg=wk.length?Math.round(wk.reduce((x,t)=>x+t.pct,0)/wk.length):null,cl=S.closed.has(a.code);
    rows+=`<div class="g-row gg ${cl?'closed':''}" style="grid-template-columns:${cols};--ac:${a.c};--pc:${(APAL[a.code]||[a.c])[0]}"><div class="g-name" data-tog="${a.code}" role="button" tabindex="0" aria-expanded="${!cl}"><svg class="car" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 6l4 4 4-4"/></svg><span class="ico" style="width:26px;height:26px;border-radius:8px;font-size:11px;background:${a.c}">${a.code}</span><b>${esc(a.name)}</b><small>${g.length} việc${avg!=null?' · TB '+avg+'%':''}</small></div>
      <div class="g-track">${bg}<div class="g-sum" style="left:${X(s)}px;width:${X(e)-X(s)}px"></div>${avg!=null?`<div class="g-sumf" style="left:${X(s)}px;width:${(X(e)-X(s))*avg/100}px"></div>`:''}</div></div>`;
    if(cl)return;
    g.sort((x,y)=>(+x.code.split('.')[1])-(+y.code.split('.')[1])).forEach((t,ix,arr)=>{
      const s=t.start||TODAY,e=t.due||s,l=X(s),w=Math.max(px*1.2,X(e)-l+(zoom==='week'?px:0)),late=active(t)&&t.due<TODAY,di=dueInfo(t),o=own(t),col=t.pct>=100?'#9AA4B2':a.c;
      const pc=t.pct>=100?['#A9B3C1','#fff']:(APAL[a.code]||['#215695','#fff']);
      rows+=`<div class="g-row ${ix===arr.length-1?'last':''}" style="grid-template-columns:${cols};--ac:${col};--pc:${pc[0]};--pt:${pc[1]};--p:${t.goal?100:t.pct}%"><div class="g-name" data-sel="${t.id}" title="${t.code} · ${esc(t.title)}"><span class="wbs" style="--ac:${col}">${t.code}</span><b>${esc(t.title)}</b></div>
      <div class="g-track">${bg}<button class="g-bar ${late?'late':''}" data-sel="${t.id}" style="left:${l}px;width:${w}px" title="${esc(t.title)} · ${dmy(s)} → ${dmy(e)} · ${t.goal?t.q:t.pct+'%'}"><span class="f" style="width:${t.goal?100:t.pct}%;${t.goal?'opacity:.45':''}"></span><span class="lab" style="${!t.goal&&w*t.pct/100<44?'color:var(--ink);text-shadow:none':''}">${w>46?(t.goal?t.q:t.pct+'%'):''}</span></button>

    });
  });
  return `<div class="tlwrap"><div class="tlbar"><h1>Timeline dự án</h1><span style="color:var(--muted);font-size:13px">Thanh đậm = % đã làm · vạch đỏ = hôm nay ${dmy(TODAY)}</span><span class="sp"></span>

}

const isLead=()=>!!user(S.role).lead;
const stalled=t=>{const h=t.hist.filter(v=>v!=null);return active(t)&&h.length>=3&&h.slice(-3).every(v=>v===h[h.length-1]);};
const cdBox=t=>{const n=ddiff(t.due),c=n<0?'late':n<=6?'soon':'ok';return `<span class="cd ${c}"><b>${Math.abs(n)}</b><small>${n<0?'ngày trễ':n===0?'hôm nay':'ngày nữa'}</small></span>`;};
function reasons(t){const r=[];const n=ddiff(t.due);
  if(n<0)r.push(['late',`Trễ ${-n} ngày`]);
  if(stalled(t))r.push(['stall','Đứng yên ≥ 3 tuần']);
  if(n>=0&&n<=6&&t.pct<50)r.push(['risk',`Còn ${n} ngày, mới ${t.pct}%`]);
  if(!t.checked)r.push(['nc','Chưa check-in']);
  return r;}

function wizDraw(){

  const t=task(W.list[W.i]),di=dueInfo(t),prev=t.hist[6];

  <div class="meta">Hạn <b>${dmy(t.due)}</b> · <span style="color:${di.k==='late'?'var(--red)':'var(--blue)'};font-weight:700">${di.l}</span> · tuần trước <b>${prev==null?'—':prev+'%'}</b></div>
  <div class="ci-row"><input type="range" min="0" max="100" step="5" value="${t.pct}" id="wzR" aria-label="Phần trăm"><input type="number" min="0" max="100" value="${t.pct}" id="wzN" aria-label="Phần trăm"></div>

  <div class="row3"><button class="btn ghost" data-wz="skip">Bỏ qua</button><span class="sp"></span><button class="btn ghost" data-wz="close">Để sau</button><button class="btn" data-wz="save">${W.i<n-1?'Lưu & tiếp':'Lưu & hoàn tất'}</button></div></div>`;
  setTimeout(()=>{const r=$('#wzR');r&&r.focus();});
}
document.addEventListener('input',e=>{if(e.target.id==='wzR')$('#wzN').value=e.target.value;if(e.target.id==='wzN')$('#wzR').value=e.target.value;});
document.addEventListener('click',e=>{
  const b=e.target.closest('[data-wz],[data-wzp],#wizStart,[data-person],[data-remind],[data-remindt],[data-donef],[data-jump],#remindAll,#lockWk,[data-clearp]');if(!b)return;
  if(b.id==='wizStart'){wizOpen();return;}

  if(b.dataset.remind){toast('Mô phỏng: đã nhắc '+user(b.dataset.remind).name+' check-in qua Telegram');return;}

function vDeptRight(){
  const base=vRight(), form=base.slice(base.indexOf('<section class="rsec"><h2>Nhiệm vụ mới'));
  if(S.dtab==='I'){
    if(isLead())return vTeamRight();
    const mine=work().filter(t=>active(t)&&t.owners.includes(S.role)).sort((a,b)=>a.due<b.due?-1:1),need=mine.filter(t=>!t.checked).length,f=mine[0];
    return `<section class="rsec"><h2>Của tôi tuần này</h2>
      ${f?`<p class="alert">${f.due<TODAY?`Việc trễ lâu nhất – ${-ddiff(f.due)} ngày`:`Việc gấp nhất – còn ${ddiff(f.due)} ngày`}</p><div class="rtitle"><b>${esc(f.title)}</b><button class="link" data-sel="${f.id}">Cập nhật</button></div>`:'<p class="empty">Bạn không có việc đang mở.</p>'}
      <div class="ckp ${need?'':'done'}" style="margin-top:16px"><div><b>${need?`Còn ${need} việc chưa check-in`:'Đã check-in đủ'}</b><div class="bar2"><i style="width:${mine.length?(mine.length-need)/mine.length*100:100}%"></i></div></div>${need?`<button class="btn" id="wizStart" style="padding:9px 14px;font-size:13px">Check-in</button>`:''}</div>
      <button class="link" data-view="focus" style="display:block;margin-top:14px;font-size:14px">Mở “Việc của tôi” ›</button></section>
      ${vTeamRight().split('<section class="rsec">').filter(s=>s.startsWith('<h2>Hạn 7')||s.startsWith('<h2>Sức khỏe')).map(s=>'<section class="rsec">'+s).join('')}`;
  }
  const a=area(S.dtab),act=work().filter(t=>active(t)&&t.area===S.dtab),days=[...Array(7)].map((_,i)=>addDays(TODAY,i));
  return `<section class="rsec"><h2>Hạn 7 ngày tới · ${a.code}</h2><div class="wk7">${days.map(d=>{const ds=act.filter(t=>t.due===d);return `<div class="${d===TODAY?'td':''}" title="${ds.map(t=>t.title).join('\n')}"><small>${d===TODAY?'Nay':DOW[dowOf(d)]}</small><b>${+d.slice(8)}</b>${ds.length?`<i class="b">${ds.length}</i>`:''}</div>`;}).join('')}</div>
    <button class="link" data-view="timeline" data-tl="${S.dtab}" style="display:block;margin-top:14px;font-size:14px">Xem timeline bộ phận ›</button></section>
  ${form.replace(`<option value="${S.dtab}">`,`<option value="${S.dtab}" selected>`).replace(/ selected>([^<]*)<\/option>(?=[^]*name="start")/,(m,x)=>m).replace(`<option value="${DEPT_LEAD[S.dtab]}" >`,`<option value="${DEPT_LEAD[S.dtab]}" selected>`).replace(`<option value="${DEPT_LEAD[S.dtab]}">`,`<option value="${DEPT_LEAD[S.dtab]}" selected>`)}`;
}
document.addEventListener('click',e=>{
  const b=e.target.closest('[data-dtab],[data-newin],[data-tl]');if(!b)return;
  if(b.dataset.dtab){S.view='dept';S.dtab=b.dataset.dtab;S.sel=null;S.person=null;render();$('#mid').scrollTop=0;return;}
  if(b.dataset.newin){const i=document.querySelector('#nf [name=title]');if(i){i.focus();i.scrollIntoView({block:'center'});}return;}
  if(b.dataset.tl){S.tArea=new Set([b.dataset.tl]);}
});

document.addEventListener('change',e=>{
  if(e.target.id!=='avIn'||!e.target.files[0])return;
  const f=e.target.files[0];if(!/^image\//.test(f.type)){toast('Hãy chọn file ảnh (JPG, PNG…)');return;}
  const img=new Image(),url=URL.createObjectURL(f);
  img.onload=()=>{const S2=160,c=document.createElement('canvas');c.width=c.height=S2;const x=c.getContext('2d'),m=Math.min(img.width,img.height);
    x.drawImage(img,(img.width-m)/2,(img.height-m)/2,m,m,0,0,S2,S2);const d=c.toDataURL('image/jpeg',.86);URL.revokeObjectURL(url);
    const me=user(S.role);me.photo=d;try{localStorage.setItem('vcntt_av_'+me.id,d);}catch(_){}toast('Đã cập nhật ảnh đại diện');render();};
  img.onerror=()=>toast('Không đọc được ảnh này');img.src=url;
});
document.addEventListener('click',e=>{if(e.target.id!=='avRm')return;const me=user(S.role);delete me.photo;try{localStorage.removeItem('vcntt_av_'+me.id);}catch(_){}toast('Đã xóa ảnh đại diện');render();});

/* Một chỗ duy nhất ghi dữ liệu – khi nối máy chủ chỉ cần thay 3 hàm này */
function dbCreate(t){DB.tasks.push(t);return t;}
function dbUpdate(t){return t;}
function dbDelete(id){const i=DB.tasks.findIndex(x=>x.id===id);if(i>=0)DB.tasks.splice(i,1);}

const canEdit=t=>!!t&&(isLead()||(!t.goal&&(t.owners.includes(S.role)||DEPT_OF[S.role]===t.area)));
const myDept=()=>DEPT_OF[S.role];
const canAdd=a=>isLead()||myDept()===a;
const noAcc=s=>String(s||'').normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/đ/g,'d').replace(/Đ/g,'D').toLowerCase().trim();
const newId=()=>'n'+Date.now()+Math.floor(Math.random()*1000);
const iso=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const YEAR=+TODAY.slice(0,4);
const QR=(q,y)=>({Q1:[`${y}-01-01`,`${y}-03-31`],Q2:[`${y}-04-01`,`${y}-06-30`],Q3:[`${y}-07-01`,`${y}-09-30`],Q4:[`${y}-10-01`,`${y}-12-31`]})[q];
S.edit=false;

/* ---- hiểu dữ liệu người dùng gõ / dán ---- */
function parseDate(v){
  if(v==null||v==='')return null;
  if(v instanceof Date&&!isNaN(v))return iso(new Date(v.getTime()+v.getTimezoneOffset()*6e4));
  if(typeof v==='number'&&v>20000&&v<80000){const d=new Date(Date.UTC(1899,11,30)+v*864e5);return d.toISOString().slice(0,10);}
  const s=String(v).trim();let m;
  if(m=s.match(/^(\d{4})-(\d{1,2})-(\d{1,2})/))return `${m[1]}-${m[2].padStart(2,'0')}-${m[3].padStart(2,'0')}`;
  if(m=s.match(/^(\d{1,2})[\/.\-](\d{1,2})(?:[\/.\-](\d{2,4}))?$/)){let y=m[3]?+m[3]:YEAR;if(y<100)y+=2000;const dd=+m[1],mm=+m[2];if(mm<1||mm>12||dd<1||dd>31)return null;return `${y}-${String(mm).padStart(2,'0')}-${String(dd).padStart(2,'0')}`;}
  return null;
}
function parseArea(v){
  const s=noAcc(v).replace(/^bo phan\s*/,'').replace(/^mang\s*/,'');if(!s)return null;
  const map={i:'I','1':'I',ii:'II','2':'II',iii:'III','3':'III',iv:'IV','4':'IV'};
  if(map[s])return map[s];
  const a=AREAS.find(a=>noAcc(a.name).includes(s)||s.includes(noAcc(a.short))||noAcc(a.short).includes(s));
  return a?a.code:null;
}
function parsePeople(v){
  return String(v||'').split(/[+,;&\/]| va /i).map(x=>noAcc(x).replace(/^(mr|ms|mrs)\.?\s*|^(anh|chi|a|c)[\s.]+/,'').trim()).filter(Boolean).map(x=>{
    const u=USERS.find(u=>!u.lead&&(noAcc(u.id)===x||noAcc(u.short)===x||noAcc(u.name)===x||noAcc(u.disp).replace(/^(mr|ms)\.?/,'')===x))||USERS.find(u=>noAcc(u.name).endsWith(' '+x)||noAcc(u.short)===x);
    return u?u.id:'?'+x;});
}
function quickParse(text){
  let t=' '+text+' ',owners=[],due=null;
  t=t.replace(/@([^\s@#]+)/g,(m,n)=>{owners.push(...parsePeople(n));return ' ';});
  t=t.replace(/\s(?:#|han\s|hạn\s)?(\d{1,2}[\/.]\d{1,2}(?:[\/.]\d{2,4})?)\s/i,(m,d)=>{due=parseDate(d)||due;return ' ';});
  return {title:t.replace(/\s+/g,' ').trim(),owners:owners.filter(o=>!o.startsWith('?')),bad:owners.filter(o=>o.startsWith('?')).map(o=>o.slice(1)),due};
}
function makeTask(o){
  return {id:newId(),code:nextCode(o.area),area:o.area,title:o.title,goal:false,q:'',gstat:'',owners:o.owners&&o.owners.length?o.owners:[S.role==='thien'?(DEPT_LEAD[o.area]||'ngoan'):S.role],
    start:o.start||TODAY,due:o.due||addDays(TODAY,7),end:null,pct:0,budget:o.budget||null,note:o.note||'',subs:(o.subs||[]).map(t=>({t,d:false})),hist:[null,null,null,null,null,null,null,0],checked:false};
}
function makeGoal(title,q,y){const r=QR(q,y||YEAR);return {id:newId(),code:nextCode('I'),area:'I',title,goal:true,q,gstat:'doing',owners:[],start:r[0],due:r[1],end:null,pct:null,budget:null,note:'',subs:[],hist:Array(8).fill(null),checked:true};}

/* ---- thanh "Thêm nhanh" ---- */
function quickBar(area){
  if(!isLead()){if(area&&area!==myDept())return '';area=area||myDept()||'II';}
  const areaSel=area?`<input type="hidden" name="qa" value="${area}">`:`<select name="qa" aria-label="Mảng">${AREAS.filter(a=>a.code!=='I').map(a=>`<option value="${a.code}" ${(DEPT_OF[S.role]||'II')===a.code?'selected':''}>${a.code}</option>`).join('')}</select>`;
  return `<form class="qbar" data-qbar="${area||''}" autocomplete="off"><span class="qplus">+</span>${areaSel}<input name="qt" placeholder="Thêm việc nhanh – gõ tên việc rồi Enter   (vd: Gia hạn license Veeam @giang 20/11)" aria-label="Thêm việc nhanh"><button type="button" class="qmore" data-addfull="${area||''}">Chi tiết…</button><button type="button" class="qmore" data-import="1" title="Dán nhiều việc từ Excel">Từ Excel</button></form>`;
}
const DEPT_OF={ngoan:'II',giang:'III',lam:'III',viet:'III',tri:'IV'};
document.addEventListener('submit',e=>{
  const f=e.target.closest('[data-qbar]');if(!f)return;e.preventDefault();
  const txt=f.qt.value.trim();if(!txt){f.qt.focus();return;}
  const p=quickParse(txt);if(!p.title){toast('Hãy gõ tên việc');return;}
  const area=f.qa.value;const t=dbCreate(makeTask({area,title:p.title,owners:p.owners,due:p.due}));
  toast(`Đã thêm ${t.code}${p.bad.length?' · không nhận ra: '+p.bad.join(', '):''}${p.due?'':' · hạn mặc định 7 ngày'}`);
  render();setTimeout(()=>{const q=document.querySelector(`[data-qbar="${f.dataset.qbar}"] [name=qt]`);q&&q.focus();},30);
});

const _vRight=vRight;vRight=function(){const t=S.sel&&task(S.sel);if(!t){S.edit=false;return _vRight();}return vDetail(t);};

function vDetail(t){
  const a=area(t.area),di=dueInfo(t),ed=canEdit(t);
  const top=`<button class="back" data-back>‹ Quay lại tổng quan</button><div class="dtop"><span class="dtag" style="background:${a.c}">${t.code} · ${esc(a.name)}</span><span class="sp"></span>${ed&&!S.edit?`<button class="mini" data-edit="1">✎ Sửa</button>`:''}${isLead()&&!S.edit?`<button class="mini red" data-del="${t.id}">Xóa</button>`:''}</div>`;

  const subs=t.goal&&!t.subs.length&&!isLead()?'':`<div class="dsec"><h4>Việc con <small>${t.subs.filter(s=>s.d).length}/${t.subs.length}</small></h4><ul class="slist">${t.subs.map((s,i)=>`<li class="${s.d?'d':''}"><input type="checkbox" data-sd="${i}" ${s.d?'checked':''} ${ed?'':'disabled'} aria-label="Xong"><span class="sno">${t.code}.${i+1}</span>${ed?`<input class="stext" data-st="${i}" value="${esc(s.t)}" aria-label="Tên việc con"><button class="sx" data-sx="${i}" title="Xóa việc con" aria-label="Xóa việc con">×</button>`:`<span>${esc(s.t)}</span>`}</li>`).join('')||'<li class="none2">Chưa có việc con.</li>'}</ul>${ed?`<form class="sadd" data-sadd="${t.id}"><input name="s" placeholder="Thêm việc con, Enter để lưu (dán nhiều dòng cũng được)" aria-label="Thêm việc con"><button class="mini">Thêm</button></form>`:''}</div>`;

function previewImport(rows){

  const go=$('#impGo');go.disabled=!ok;go.textContent=ok?`Nhập ${ok} việc`:'Nhập việc';

const DEPT_HEADS={II:['ngoan'],III:['lam','giang'],IV:['tri']};

function headsHTML(code,long){const h=DEPT_HEADS[code]||[DEPT_LEAD[code]];return `<span class="heads">${h.map(id=>avatar(user(id))).join('')}</span>Phụ trách${long?' bộ phận':''}: ${long?'<b>':''}${h.map(headName).join(', ')}${long?'</b>':''}`;}
const sundayOf=d=>addDays(d,(7-dowOf(d))%7);
function bucket(t){
  if(t.goal)return['Mục tiêu '+t.q,'b-goal'];
  if(t.pct>=100)return['Đã xong','b-done'];
  if(!t.due)return['Chưa có hạn','b-later'];
  const n=ddiff(t.due),wEnd=sundayOf(TODAY);
  if(n<0)return[`Trễ ${-n} ngày`,'b-late'];
  if(n===0)return['Hôm nay','b-today'];
  if(n===1)return['Ngày mai','b-today'];
  if(t.due<=wEnd)return[`Tuần này · ${DOW[dowOf(t.due)]} ${dmy(t.due)}`,'b-week'];
  if(t.due<=addDays(wEnd,7))return[`Tuần sau · ${DOW[dowOf(t.due)]} ${dmy(t.due)}`,'b-next'];
  return[`Hạn ${dmy(t.due)}`,'b-later'];
}

function render(){
  const app=$('#app'),wide=S.view==='timeline';
  const noRight=S.view==='dept'&&S.dtab==='I'&&!S.sel;
  app.classList.toggle('wide',wide||noRight);
  $('#left').innerHTML=vLeft();
  if(wide){$('#mid').innerHTML=vTimeline();$('#mid').style.padding='0';$('#mid').style.overflow='hidden';const g=$('#gantt');if(g&&firstTL){scrollToday();firstTL=false;}}
  else{$('#mid').style.padding='';$('#mid').style.overflow='';$('#mid').innerHTML=S.view==='report'?vReport():S.view==='dept'?vDept():S.view==='team'?vTeam():S.view==='focus'?vFocus():vMid();$('#right').innerHTML=S.sel?vRight():S.view==='dept'?vDeptRight():S.view==='team'||(isLead()&&S.view!=='inbox')?vTeamRight():S.view==='focus'?vFocusRight():vRight();}
}
function scrollToday(){const g=$('#gantt'),t=$('.g-today');if(g&&t)g.scrollLeft=Math.max(0,parseFloat(t.style.left)-320-g.clientWidth*0.35);}
document.addEventListener('click',e=>{
  if(ciHandle(e,()=>{render();}))return;
  const b=e.target.closest('[data-view],[data-sel],[data-back],[data-karea],[data-tarea],[data-zoom],[data-tog],#toToday,#xlsx');if(!b)return;
  if(b.dataset.view){S.view=b.dataset.view;S.sel=null;S.person=null;if(S.view==='timeline')firstTL=true;return render();}
  if(b.dataset.sel){if(S.view==='timeline'){S.view='inbox';}S.sel=b.dataset.sel;render();mobJump('right');return;}
  if(b.hasAttribute('data-back')){S.sel=null;render();mobJump('mid');return;}
  if(b.dataset.karea){S.kArea=b.dataset.karea;return render();}
  if(b.dataset.tarea){const a=b.dataset.tarea;S.tArea.has(a)?S.tArea.delete(a):S.tArea.add(a);if(!S.tArea.size)S.tArea.add(a);return render();}
  if(b.dataset.zoom){S.zoom=b.dataset.zoom;firstTL=true;return render();}
  if(b.dataset.tog){const a=b.dataset.tog;S.closed.has(a)?S.closed.delete(a):S.closed.add(a);const sl=$('#gantt').scrollLeft;render();$('#gantt').scrollLeft=sl;return;}
  if(b.id==='toToday'){scrollToday();return;}
  if(b.id==='xlsx')exportXlsx();
});
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.dataset&&e.target.dataset.tog){e.target.click();}});
document.addEventListener('change',e=>{if(e.target.id==='role'){S.role=e.target.value;S.view='dept';S.dtab='I';S.person=null;S.sel=null;S.kArea='all';return render();}});
document.addEventListener('submit',e=>{if(e.target.id!=='nf')return;e.preventDefault();const f=new FormData(e.target),id='n'+Date.now();
  DB.tasks.push({id,code:nextCode(f.get('area')),area:f.get('area'),title:f.get('title').trim(),owners:[f.get('o')],start:f.get('start')||TODAY,due:f.get('due'),end:null,pct:0,budget:null,note:'',hist:[null,null,null,null,null,null,null,0],checked:false,subs:[]});
  S.sel=id;toast('Đã tạo nhiệm vụ');render();});
render();
function mobJump(id){if(innerWidth>900)return;const el=document.getElementById(id);el&&requestAnimationFrame(()=>el.scrollIntoView({behavior:'smooth',block:'start'}));}
</script>
</body>
</html>
